<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:ital,wght@0,100..700;1,100..700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./main.css" />
</head>
<body>
    <section id="formulario">
        <div class="container">
            <h1>Validação de Números</h1>
            <form id="form-numeros">
                <input type="number" id="campoA" placeholder="Primeiro número" required />
                <p class="mensagem_1_error"></p>
                <input type="number" id="campoB" placeholder="Segundo número" required />
                <button type="submit">Submeter</button>
                <p class="mensagem_success"></p>
                <p class="mensagem_2_error"></p>
            </form>
        </div>
    </section>
    <script src = "./main.js"></script>
</body>
</html>
